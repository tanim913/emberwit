# Generates lib/src/bindings/llama_bindings.dart from llama.cpp's C API.
#
# Regenerate after bumping the llama.cpp submodule:
#   dart run ffigen --config ffigen.yaml
# ffigen needs libclang. The pinned path is from `pip install --user libclang`;
# pass --verbose and edit llvm-path for other setups.
name: LlamaBindings
description: Raw bindings to llama.cpp (llama.h) and the ggml backend registry.
output: lib/src/bindings/llama_bindings.dart
llvm-path:
  - ~/.local/lib/python3.10/site-packages/clang/native/libclang.so
  - /usr/lib/llvm-18
  - /usr/local/opt/llvm
headers:
  entry-points:
    - third_party/llama.cpp/include/llama.h
    - third_party/llama.cpp/ggml/include/ggml-backend.h
  include-directives:
    - third_party/llama.cpp/include/llama.h
    - third_party/llama.cpp/ggml/include/ggml-backend.h
    - third_party/llama.cpp/ggml/include/ggml.h
compiler-opts:
  - -Ithird_party/llama.cpp/ggml/include
  - -Ithird_party/llama.cpp/include
exclude-all-by-default: true
functions:
  include:
    - llama_backend_init
    - llama_backend_free
    - llama_log_set
    - llama_print_system_info
    - llama_supports_mmap
    - llama_supports_gpu_offload
    - llama_model_default_params
    - llama_context_default_params
    - llama_sampler_chain_default_params
    - llama_model_load_from_file
    - llama_model_free
    - llama_model_get_vocab
    - llama_model_n_ctx_train
    - llama_model_n_params
    - llama_model_size
    - llama_model_desc
    - llama_model_meta_val_str
    - llama_model_chat_template
    - llama_init_from_model
    - llama_free
    - llama_n_ctx
    - llama_n_batch
    - llama_set_n_threads
    - llama_get_memory
    - llama_memory_clear
    - llama_batch_get_one
    - llama_decode
    - llama_vocab_is_eog
    - llama_vocab_n_tokens
    - llama_tokenize
    - llama_token_to_piece
    - llama_chat_apply_template
    - llama_sampler_chain_init
    - llama_sampler_chain_add
    - llama_sampler_init_dist
    - llama_sampler_init_greedy
    - llama_sampler_init_top_k
    - llama_sampler_init_top_p
    - llama_sampler_init_min_p
    - llama_sampler_init_temp
    - llama_sampler_init_penalties
    - llama_sampler_sample
    - llama_sampler_reset
    - llama_sampler_free
    - ggml_backend_load_all_from_path
    - ggml_backend_dev_count
    - ggml_backend_dev_get
    - ggml_backend_dev_name
    - ggml_backend_dev_description
    - ggml_backend_dev_type
structs:
  include:
    - llama_chat_message
  dependency-only: opaque
unions:
  dependency-only: opaque
silence-enum-warning: true
comments:
  style: any
  length: brief
preamble: |
  // Generated by package:ffigen from llama.cpp headers (MIT license).
  // ignore_for_file: type=lint, unused_field, unused_element
