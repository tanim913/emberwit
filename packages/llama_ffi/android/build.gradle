// Builds llama.cpp from third_party/llama.cpp with CMake (see src/CMakeLists.txt)
// and packages the shared libraries with the app.
group = "app.emberwit.llama_ffi"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "app.emberwit.llama_ffi"

    compileSdk = 36

    ndkVersion = android.ndkVersion

    defaultConfig {
        minSdk = 26

        ndk {
            // Same ABIs as the app. 32-bit ARM is not supported.
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                // Always optimise: an unoptimised llama.cpp is unusably slow,
                // even in debug builds of the app.
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
