name: llama_ffi
description: >-
  Dart FFI bindings for llama.cpp with a synchronous runtime API. Builds
  llama.cpp for Android and Linux, and uses the official xcframework on iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ffi: 2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: 22.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
