include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/bindings/**
    - third_party/**
    - build/**
    - android/**
    - ios/**
    - linux/**
  errors:
    unawaited_futures: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
