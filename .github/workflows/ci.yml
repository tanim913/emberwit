name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install SQLCipher (chat database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
      - run: flutter pub get --enforce-lockfile
      - run: tool/codegen.sh
      - name: Format
        run: >
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool
          packages/llama_ffi/lib packages/llama_ffi/test
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test llama_ffi package (without native library)
        working-directory: packages/llama_ffi
        run: flutter test --exclude-tags native
      - name: Test with coverage
        run: flutter test --coverage --exclude-tags native
      - name: Coverage gate (core, engine, domain, data >= 80%)
        run: dart run tool/coverage_check.dart --min=80 | tee coverage/summary.txt
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/summary.txt ]; then
            { echo '### Coverage'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  native:
    name: Native llama.cpp tests (Linux host build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlcipher-dev
      - run: flutter pub get --enforce-lockfile
      - run: tool/codegen.sh
      - name: Build llama.cpp for the host
        run: packages/llama_ffi/tool/build_host.sh
      - name: Fetch test model
        run: packages/llama_ffi/tool/fetch_test_model.sh
      - name: llama_ffi native tests
        working-directory: packages/llama_ffi
        env:
          LLAMA_FFI_LIB_DIR: ${{ github.workspace }}/packages/llama_ffi/build/host/bin
        run: flutter test --tags native
      - name: Engine end to end tests
        env:
          LLAMA_FFI_LIB_DIR: ${{ github.workspace }}/packages/llama_ffi/build/host/bin
        run: flutter test --tags native

  licenses:
    name: Dependency license audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart pub global activate very_good_cli 1.5.0
      - name: Check licenses of all dependencies
        run: >
          very_good packages check licenses
          --dependency-type=direct-main,transitive
          --allowed=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,Zlib,ISC,MPL-2.0

  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: tool/codegen.sh
      - name: Fetch the bundled benchmark model
        run: tool/fetch_benchmark_model.sh
      - name: Dev debug APK
        run: flutter build apk --debug --flavor dev --target-platform android-arm64,android-x64
      - name: Prod release APK (R8, obfuscated)
        run: >
          flutter build apk --release --flavor prod
          --target-platform android-arm64,android-x64
          --obfuscate --split-debug-info=build/symbols/prod
      - name: Security audit of the release APK
        run: tool/security_audit.sh build/app/outputs/flutter-apk/app-prod-release.apk

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: tool/codegen.sh
      - name: Fetch the bundled benchmark model
        run: tool/fetch_benchmark_model.sh
      - name: Dev debug build
        run: flutter build ios --debug --no-codesign --flavor dev
      - name: Prod release build (obfuscated)
        run: >
          flutter build ios --release --no-codesign --flavor prod
          --obfuscate --split-debug-info=build/symbols/prod
