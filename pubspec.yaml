name: emberwit
description: "Emberwit: a private AI assistant that runs large language models fully offline on your phone."
publish_to: 'none'

# Semantic version. Managed by release-please; do not edit by hand.
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Every dependency is pinned to an exact version. Rationale and licenses are
# recorded in docs/DEPENDENCIES.md. Dependabot proposes upgrades.
dependencies:
  background_downloader: 9.6.2
  battery_plus: 7.1.2
  crypto: 3.0.7
  cryptography: 2.9.0
  device_info_plus: 13.2.0
  dio: 5.11.1
  drift: 2.35.0
  ffi: 2.2.0
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_math_fork: 0.7.4
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.0.1
  intl: 0.20.3
  json_annotation: 4.12.0
  llama_ffi:
    path: packages/llama_ffi
  local_auth: 3.0.2
  markdown: 7.3.1
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  riverpod_annotation: 4.0.7
  shared_preferences: 2.5.5
  sqlite3: 3.6.0
  url_launcher: 6.3.2
  uuid: 4.6.0
dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  integration_test:
    sdk: flutter
  json_serializable: 6.14.1
  mocktail: 1.0.5
  riverpod_generator: 4.0.9
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 11.0.0

# Native build hook options.
hooks:
  user_defines:
    sqlite3:
      # SQLCipher instead of plain SQLite: the chat database is encrypted
      # at rest (AES-256). See lib/features/chat/data/chat_database.dart.
      # Android and iOS bundle the prebuilt SQLCipher. Linux (desktop and
      # host tests) uses the system libsqlcipher, which works on older
      # glibc too (tool/build_host_sqlcipher.sh or apt libsqlcipher-dev).
      source:
        default: sqlcipher
        linux: system
      name_linux: sqlcipher

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL.txt
    # KaTeX math fonts (bundled by flutter_math_fork), MIT.
    - assets/fonts/KaTeX-LICENSE.txt
    # Micro benchmark model, fetched by tool/fetch_benchmark_model.sh.
    - assets/models/
    # Signed model catalog fallback, built by tool/catalog/ (see CATALOG.md).
    - assets/catalog/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf
